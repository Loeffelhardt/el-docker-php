name: CI / Build

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "alpine/**"
      - "debian/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          ## Alpine

          ### Alpine 3.23 - PHP 8.4
          - image: "alpine/3.23/8.4/Dockerfile"
            tags: [ "loeffelhardt/php:8.4-alpine3.23" ]
            platforms: [ "linux/amd64", "linux/arm64" ]

          ### Alpine 3.24 - PHP 8.4 & 8.5
          - image: "alpine/3.24/8.4/Dockerfile"
            tags: [ "loeffelhardt/php:8.4-alpine3.24", "loeffelhardt/php:8.4" ]
            platforms: [ "linux/amd64", "linux/arm64" ]

          - image: "alpine/3.24/8.5/Dockerfile"
            tags: [ "loeffelhardt/php:8.5-alpine3.24", "loeffelhardt/php:latest", "loeffelhardt/php:8.5" ]
            platforms: [ "linux/amd64", "linux/arm64" ]

          ## Debian

          ### Debian bullseye - PHP 8.4
          - image: 'debian/bullseye/8.4/Dockerfile'
            tags: [ 'loeffelhardt/php:8.4-debian' ]
            platforms: [ "linux/amd64", "linux/arm64" ]

          ### Debian bookworm - PHP 8.5
          - image: 'debian/bookworm/8.5/Dockerfile'
            tags: [ 'loeffelhardt/php:8.5-debian' ]
            platforms: [ "linux/amd64", "linux/arm64" ]

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.ref == 'refs/heads/main' }}
          file: ${{ matrix.image }}
          tags: ${{ join(matrix.tags) }}
          platforms: ${{ join(matrix.platforms) }}
